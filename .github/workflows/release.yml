name: Build & Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f keystore.jks

      - name: Prepare APK Assets
        id: prepare_asset
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi

          mkdir -p release_assets
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            APK_PATH=$(find app/build/outputs/apk/release -name "*${ABI}*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              TARGET="release_assets/SwiftKeyWhisper-${TAG}-${ABI}.apk"
              echo "Packaging $ABI: $APK_PATH -> $TARGET"
              cp "$APK_PATH" "$TARGET"
            else
              echo "Warning: No APK found for $ABI"
            fi
          done

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwiftKeyWhisper-Signed
          path: release_assets/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_asset.outputs.tag }}
          name: "SwiftKeyWhisper Release ${{ steps.prepare_asset.outputs.tag }}"
          files: release_assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
